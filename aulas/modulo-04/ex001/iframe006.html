<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionando Conteúdos</title>
  </head>
  <body>
    <h1>Conteúdos dentro de Iframes</h1>
    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Consectetur veritatis
      ullam rerum sed! Voluptatem quam laborum, unde reprehenderit aut maxime molestias
      cumque provident reiciendis asperiores at, officia a voluptate sed.
    </p>
    <h2>Vídeos</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/dzhJsc1YszU?si=wts9Rtjoz9o-eXbN"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <h2>Mapas do Google</h2>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29387.137851430376!2d-43.204389723333584!3d-22.97259986934206!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9bd523d20f9c53%3A0x693c6132635e6b0d!2sCopacabana%2C%20Rio%20de%20Janeiro%20-%20RJ!5e0!3m2!1spt-BR!2sbr!4v1774017297172!5m2!1spt-BR!2sbr"
      width="400"
      height="300"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <h2>Mapas do Waze</h2>
    <iframe
      src="https://embed.waze.com/iframe?zoom=16&lat=-22.969281&lon=-43.186794&ct=livemap"
      width="600"
      height="450"
      allowfullscreen
    ></iframe>
  </body>
</html>
