<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudos de iframe</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      iframe {
        width: 400px;
        height: 400px;
        border: 5px solid black;
      }
    </style>
  </head>
  <body>
    <h1>Testando o uso de iframe</h1>
    <p>
      Acessando o site do
      <!--Tamanho Padrão 300px X 150px -->
      <iframe
        src="https://www.cursoemvideo.com"
        frameborder="0"
        height="500px"
        scrolling="no"
      >
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
      </iframe>

      para aprender a programar.
    </p>
    <p>
      O repositório do Guanabara também é legal.
      <iframe
        src="https://gustavoguanabara.github.io"
        frameborder="0"
        width="500px"
        height="500px"
      >
        <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
      </iframe>
    </p>
  </body>
</html>
